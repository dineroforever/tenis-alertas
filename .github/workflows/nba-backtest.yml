name: NBA backtest Kalshi
on:
  schedule:
    - cron: "23 */6 * * *"   # retoma solo si quedó incompleto; si ya terminó, sale en segundos
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicio (AAAA-MM-DD)"
        default: "2025-11-10"
      hasta:
        description: "Fecha fin (AAAA-MM-DD)"
        default: "2026-06-30"
concurrency:
  group: nba-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r nba/requirements.txt
      - name: Backtest
        env:
          # Telegram APAGADO a pedido de Roberto (30-oct-2026) hasta que el NBA tenga resultados positivos.
          # Para reactivarlo, restaurar TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID desde secrets.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m nba.backtest --desde "${{ inputs.desde || '2025-11-10' }}" --hasta "${{ inputs.hasta || '2026-06-30' }}" --max-mins 320
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add nba/data
          git diff --cached --quiet && exit 0
          git commit -m "nba: backtest"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
