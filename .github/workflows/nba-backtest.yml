name: NBA backtest Kalshi
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicio (AAAA-MM-DD)"
        default: "2025-11-05"
      hasta:
        description: "Fecha fin (AAAA-MM-DD)"
        default: "2026-06-30"
concurrency:
  group: nba-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r nba/requirements.txt
      - name: Backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nba.backtest --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta }}" --max-mins 320
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add nba/data
          git diff --cached --quiet && exit 0
          git commit -m "nba: backtest"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
