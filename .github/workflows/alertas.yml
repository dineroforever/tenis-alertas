name: Alertas tenis Kalshi

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: alertas-tenis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mensaje de prueba a Telegram
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          R=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=✅ Bot de tenis conectado. Estoy vigilando los partidos en vivo; solo te escribo cuando haya una apuesta con edge o cuando toque vender.")
          if echo "$R" | grep -q '"ok":true'; then echo "Telegram OK"; else echo "Telegram FALLO: $R"; exit 1; fi
      - name: Vigilar partidos y avisar por Telegram
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANKROLL: ${{ vars.BANKROLL || '500' }}
          PYTHONUNBUFFERED: "1"
          LOOP_MINUTES: "28"
          POLL_SECONDS: "120"
        run: python tenis_alertas.py
      - name: Guardar registro de senales
        if: always()
        run: |
          git config user.name "bot-tenis"
          git config user.email "bot-tenis@users.noreply.github.com"
          mkdir -p /tmp/reg
          for f in senales_tenis.csv senales_salidas.csv; do
            if [ -f "$f" ]; then
              base=$(git show HEAD:"$f" 2>/dev/null | wc -l)
              tail -n +$((base+1)) "$f" > "/tmp/reg/$f"
            fi
          done
          if [ -f estado_alertas.json ]; then cp estado_alertas.json /tmp/reg/; fi
          for i in 1 2 3; do
            rm -f senales_tenis.csv senales_salidas.csv estado_alertas.json
            git fetch -q origin main && git reset -q --hard origin/main
            for f in senales_tenis.csv senales_salidas.csv; do
              if [ -s "/tmp/reg/$f" ]; then
                if [ -f "$f" ] && head -1 "/tmp/reg/$f" | grep -q '^fecha_utc'; then
                  tail -n +2 "/tmp/reg/$f" >> "$f"
                else
                  cat "/tmp/reg/$f" >> "$f"
                fi
                git add "$f"
              fi
            done
            if [ -f /tmp/reg/estado_alertas.json ]; then cp /tmp/reg/estado_alertas.json .; git add estado_alertas.json; fi
            if git diff --cached --quiet; then break; fi
            if git commit -q -m "Registro de senales" && git push -q; then break; fi
            sleep 5
          done
